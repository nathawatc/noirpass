[package]
name = "noirpass"
version = "0.1.0"
edition = "2024"
description = "Minimal on-demand GPG-backed freedesktop Secret Service"
readme = "README.md"
repository = "https://codeberg.org/koharu/noirpass"
license = "Apache-2.0"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[features]
default = []
secret-tool-smoke = []

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
aes = "0.9.1"
cbc = "0.2.1"
# `env` (feature addition) enables `#[arg(env = ...)]` for NOIRPASS_STORE.
clap = { version = "4.6.1", features = ["derive", "env"] }
hkdf = "0.13.0"
num-bigint-dig = "0.9.1"
rand = "0.10.2"
redb = "4.1.0"
secrecy = "0.10.3"
sequoia-gpg-agent = "0.6.2"
sequoia-openpgp = { version = "2.4.0", default-features = false, features = ["crypto-openssl"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `p2p` (feature addition, not a version change) enables in-process
# peer-to-peer connections used by the D-Bus layer smoke tests.
zbus = { version = "5.16.0", default-features = false, features = ["tokio", "p2p"] }
zeroize = "1.9.0"

[dev-dependencies]
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
tempfile = "3.27.0"
