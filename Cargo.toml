[package]
name = "noirpass"
version = "1.0.2"
edition = "2024"
rust-version = "1.95"
description = "Minimal on-demand GPG-backed freedesktop Secret Service"
repository = "https://github.com/nathawatc/noirpass"
license = "Apache-2.0"
keywords = [
    "secret-service",
    "freedesktop",
    "dbus",
    "gpg",
    "keyring",
]
categories = [
    "command-line-utilities",
    "cryptography",
    "authentication",
]
exclude = [
    ".github/",
    ".gitignore",
    ".rumdl.toml",
    # Matches root and all nested AGENTS.md files (src/, systemd/, tests/).
    "AGENTS.md",
    "SKILL.md",
    "flake.lock",
    "flake.nix",
]
publish = false

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[features]
default = []
secret-tool-smoke = []

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
aes = "0.9.1"
cbc = "0.2.1"
# `env` (feature addition) enables `#[arg(env = ...)]` for NOIRPASS_STORE.
clap = { version = "4.6.2", features = ["derive", "env"] }
hkdf = "0.13.0"
# Linux `openat2` and dirfd-relative operations keep Noirpass-owned paths anchored and fail-closed.
libc = "0.2.189"
num-bigint-dig = { version = "0.9.1", features = ["zeroize"] }
rand = "0.10.2"
# Range-lock API protects incomplete indexes without parsing or initializing them.
redb = "5.0.0"
sequoia-gpg-agent = "0.6.2"
sequoia-openpgp = { version = "2.4.1", default-features = false, features = ["crypto-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml_edit = "0.25.13"
zbus = { version = "6.5.0", default-features = false, features = ["tokio", "proxy", "service"] }
zeroize = { version = "1.9.0", features = ["serde"] }

[dev-dependencies]
oo7 = { version = "0.7.3", default-features = false, features = ["tokio", "native_crypto"] }
roxmltree = "0.21.2"
tempfile = "3.27.0"
# `p2p` enables in-process peer-to-peer connections used by the D-Bus layer tests.
zbus = { version = "6.5.0", default-features = false, features = ["p2p"] }
